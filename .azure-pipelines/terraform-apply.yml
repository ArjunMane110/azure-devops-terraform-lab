trigger:
  branches:
    include:
      - main
      - dev

pool:
  name: self-hosted-local

variables:
  - group: terraform-dev-vars
  - name: environment
    value: 'dev'
  - name: approvalEnvironment
    value: 'dev-environment'

stages:
  - stage: Plan
    displayName: Terraform Plan
    jobs:
      - job: TerraformPlan
        displayName: Init and Plan
        steps:

          - checkout: self

          - task: Bash@3
            displayName: Set Environment from Source Branch
            inputs:
              targetType: 'inline'
              script: |
                SOURCE="$(Build.SourceBranchName)"
                echo "Source branch: $SOURCE"
                if [[ "$SOURCE" == "main" ]]; then
                  echo "##vso[task.setvariable variable=environment]prod"
                  echo "##vso[task.setvariable variable=approvalEnvironment]prod-environment"
                  echo "Environment set to prod"
                else
                  echo "##vso[task.setvariable variable=environment]dev"
                  echo "##vso[task.setvariable variable=approvalEnvironment]dev-environment"
                  echo "Environment set to dev"
                fi

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/$(environment)'
              backendServiceArm: 'azdev-service-connection'
              backendAzureRmResourceGroupName: '$(TF_STATE_RG)'
              backendAzureRmStorageAccountName: '$(TF_STATE_SA)'
              backendAzureRmContainerName: '$(TF_STATE_CONTAINER)'
              backendAzureRmKey: '$(environment).terraform.tfstate'

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/$(environment)'
              environmentServiceNameAzureRM: 'azdev-service-connection'
              commandOptions: '-out=tfplan'

          - task: PublishPipelineArtifact@1
            displayName: Publish Plan File
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/environments/$(environment)/tfplan'
              artifact: 'tfplan'

  - stage: Apply
    displayName: Terraform Apply
    dependsOn: Plan
    variables:
      - name: environment
        value: $[ stageDependencies.Plan.TerraformPlan.outputs['SetEnv.environment'] ]
      - name: approvalEnvironment
        value: $[ stageDependencies.Plan.TerraformPlan.outputs['SetEnv.approvalEnvironment'] ]
    jobs:
      - deployment: TerraformApply
        displayName: Apply with Approval Gate
        environment: $(approvalEnvironment)
        strategy:
          runOnce:
            deploy:
              steps:

                - checkout: self

                - task: Bash@3
                  displayName: Set Environment from Source Branch
                  inputs:
                    targetType: 'inline'
                    script: |
                      SOURCE="$(Build.SourceBranchName)"
                      echo "Source branch: $SOURCE"
                      if [[ "$SOURCE" == "main" ]]; then
                        echo "##vso[task.setvariable variable=environment]prod"
                        echo "Environment set to prod"
                      else
                        echo "##vso[task.setvariable variable=environment]dev"
                        echo "Environment set to dev"
                      fi

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: 'latest'

                - task: DownloadPipelineArtifact@2
                  displayName: Download Plan File
                  inputs:
                    artifact: 'tfplan'
                    path: '$(System.DefaultWorkingDirectory)/environments/$(environment)'

                - task: TerraformTaskV4@4
                  displayName: Terraform Init
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/environments/$(environment)'
                    backendServiceArm: 'azdev-service-connection'
                    backendAzureRmResourceGroupName: '$(TF_STATE_RG)'
                    backendAzureRmStorageAccountName: '$(TF_STATE_SA)'
                    backendAzureRmContainerName: '$(TF_STATE_CONTAINER)'
                    backendAzureRmKey: '$(environment).terraform.tfstate'

                - task: TerraformTaskV4@4
                  displayName: Terraform Apply
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/environments/$(environment)'
                    environmentServiceNameAzureRM: 'azdev-service-connection'
                    commandOptions: 'tfplan'