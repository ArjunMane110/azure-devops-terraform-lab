trigger:
  branches:
    include:
      - main
      - dev

pool:
  vmImage: windows-latest

variables:
  - group: terraform-dev-vars
  - name: environment
    value: 'dev'

stages:
  - stage: Plan
    displayName: Terraform Plan
    jobs:
      - job: TerraformPlan
        displayName: Init and Plan
        steps:

          - checkout: self

          - task: PowerShell@2
            displayName: Set Environment from Source Branch
            name: SetEnv
            inputs:
              targetType: 'inline'
              script: |
                $source = "$(Build.SourceBranchName)"
                Write-Host "Source branch: $source"
                if ($source -eq "main") {
                  Write-Host "##vso[task.setvariable variable=environment;isOutput=true]prod"
                  Write-Host "Environment set to prod"
                } else {
                  Write-Host "##vso[task.setvariable variable=environment;isOutput=true]dev"
                  Write-Host "Environment set to dev"
                }

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/$(environment)'
              backendServiceArm: 'azdev-service-connection'
              backendAzureRmResourceGroupName: '$(TF_STATE_RG)'
              backendAzureRmStorageAccountName: '$(TF_STATE_SA)'
              backendAzureRmContainerName: '$(TF_STATE_CONTAINER)'
              backendAzureRmKey: '$(environment).terraform.tfstate'

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/$(environment)'
              environmentServiceNameAzureRM: 'azdev-service-connection'
              commandOptions: '-out=tfplan'

          - task: PublishPipelineArtifact@1
            displayName: Publish Plan File
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/environments/$(environment)/tfplan'
              artifact: 'tfplan'

  - stage: Apply
    displayName: Terraform Apply
    dependsOn: Plan
    variables:
      - name: environment
        value: $[ stageDependencies.Plan.TerraformPlan.outputs['SetEnv.environment'] ]
    jobs:
      - job: TerraformApply
        displayName: Auto Apply
        steps:

          - checkout: self

          - task: PowerShell@2
            displayName: Set Environment from Source Branch
            inputs:
              targetType: 'inline'
              script: |
                $source = "$(Build.SourceBranchName)"
                Write-Host "Source branch: $source"
                if ($source -eq "main") {
                  Write-Host "##vso[task.setvariable variable=environment]prod"
                  Write-Host "Environment set to prod"
                } else {
                  Write-Host "##vso[task.setvariable variable=environment]dev"
                  Write-Host "Environment set to dev"
                }

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: DownloadPipelineArtifact@2
            displayName: Download Plan File
            inputs:
              artifact: 'tfplan'
              path: '$(System.DefaultWorkingDirectory)/environments/$(environment)'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/$(environment)'
              backendServiceArm: 'azdev-service-connection'
              backendAzureRmResourceGroupName: '$(TF_STATE_RG)'
              backendAzureRmStorageAccountName: '$(TF_STATE_SA)'
              backendAzureRmContainerName: '$(TF_STATE_CONTAINER)'
              backendAzureRmKey: '$(environment).terraform.tfstate'

          - task: TerraformTaskV4@4
            displayName: Terraform Apply
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/$(environment)'
              environmentServiceNameAzureRM: 'azdev-service-connection'
              commandOptions: '-auto-approve'