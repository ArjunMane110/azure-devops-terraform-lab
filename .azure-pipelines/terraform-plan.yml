parameters:
  - name: environment
    displayName: Target Environment
    type: string
    default: dev
    values:
      - dev
      - prod

trigger:
  branches:
    include:
      - main
      - dev

pool:
  name: self-hosted-local

variables:
  - group: terraform-dev-vars
  - name: environment
    value: ${{ parameters.environment }}
  - name: approvalEnvironment
    value: ${{ parameters.environment }}-environment

stages:
  - stage: Plan
    displayName: Terraform Plan - ${{ parameters.environment }}
    jobs:
      - job: TerraformPlan
        displayName: Init and Plan
        steps:

          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'
              backendServiceArm: 'azdev-service-connection'
              backendAzureRmResourceGroupName: '$(TF_STATE_RG)'
              backendAzureRmStorageAccountName: '$(TF_STATE_SA)'
              backendAzureRmContainerName: '$(TF_STATE_CONTAINER)'
              backendAzureRmKey: '${{ parameters.environment }}.terraform.tfstate'

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'
              environmentServiceNameAzureRM: 'azdev-service-connection'
              commandOptions: '-out=tfplan'

          - task: PublishPipelineArtifact@1
            displayName: Publish Plan File
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}/tfplan'
              artifact: 'tfplan'

  - stage: Apply
    displayName: Terraform Apply - ${{ parameters.environment }}
    dependsOn: Plan
    jobs:
      - deployment: TerraformApply
        displayName: Apply with Approval Gate
        environment: '${{ parameters.environment }}-environment'
        strategy:
          runOnce:
            deploy:
              steps:

                - checkout: self

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: 'latest'

                - task: DownloadPipelineArtifact@2
                  displayName: Download Plan File
                  inputs:
                    artifact: 'tfplan'
                    path: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'

                - task: TerraformTaskV4@4
                  displayName: Terraform Init
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'
                    backendServiceArm: 'azdev-service-connection'
                    backendAzureRmResourceGroupName: '$(TF_STATE_RG)'
                    backendAzureRmStorageAccountName: '$(TF_STATE_SA)'
                    backendAzureRmContainerName: '$(TF_STATE_CONTAINER)'
                    backendAzureRmKey: '${{ parameters.environment }}.terraform.tfstate'

                - task: TerraformTaskV4@4
                  displayName: Terraform Apply
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'
                    environmentServiceNameAzureRM: 'azdev-service-connection'
                    commandOptions: 'tfplan'