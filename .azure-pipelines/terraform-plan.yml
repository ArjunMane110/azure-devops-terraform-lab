trigger: none

pr:
  branches:
    include:
      - main
      - dev

pool:
  name: self-hosted-local

variables:
  - group: terraform-dev-vars
  - name: environment
    ${{ if eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/main') }}:
      value: 'prod'
    ${{ if eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/dev') }}:
      value: 'dev'

stages:
  - stage: Validate
    displayName: Terraform Validate and Plan - $(environment)
    jobs:
      - job: TerraformPlan
        displayName: Init, Validate and Plan
        steps:

          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/$(environment)'
              backendServiceArm: 'azdev-service-connection'
              backendAzureRmResourceGroupName: '$(TF_STATE_RG)'
              backendAzureRmStorageAccountName: '$(TF_STATE_SA)'
              backendAzureRmContainerName: '$(TF_STATE_CONTAINER)'
              backendAzureRmKey: '$(environment).terraform.tfstate'

          - task: TerraformTaskV4@4
            displayName: Terraform Validate
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/$(environment)'

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/$(environment)'
              environmentServiceNameAzureRM: 'azdev-service-connection'