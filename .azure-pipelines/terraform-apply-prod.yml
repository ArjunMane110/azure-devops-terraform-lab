trigger: none

pool:
  name: self-hosted-local

variables:
  - group: terraform-dev-vars

stages:
  - stage: Plan
    displayName: Terraform Plan - prod
    jobs:
      - job: TerraformPlan
        displayName: Init and Plan
        steps:

          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/prod'
              backendServiceArm: 'azdev-service-connection'
              backendAzureRmResourceGroupName: '$(TF_STATE_RG)'
              backendAzureRmStorageAccountName: '$(TF_STATE_SA)'
              backendAzureRmContainerName: '$(TF_STATE_CONTAINER)'
              backendAzureRmKey: 'prod.terraform.tfstate'

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/prod'
              environmentServiceNameAzureRM: 'azdev-service-connection'
              commandOptions: '-out=tfplan'

          - task: PublishPipelineArtifact@1
            displayName: Publish Plan File
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/environments/prod/tfplan'
              artifact: 'tfplan'

  - stage: Apply
    displayName: Terraform Apply - prod
    dependsOn: Plan
    jobs:
      - deployment: TerraformApply
        displayName: Apply with Approval Gate
        environment: 'prod-environment'
        strategy:
          runOnce:
            deploy:
              steps:

                - checkout: self

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: 'latest'

                - task: DownloadPipelineArtifact@2
                  displayName: Download Plan File
                  inputs:
                    artifact: 'tfplan'
                    path: '$(System.DefaultWorkingDirectory)/environments/prod'

                - task: TerraformTaskV4@4
                  displayName: Terraform Init
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/environments/prod'
                    backendServiceArm: 'azdev-service-connection'
                    backendAzureRmResourceGroupName: '$(TF_STATE_RG)'
                    backendAzureRmStorageAccountName: '$(TF_STATE_SA)'
                    backendAzureRmContainerName: '$(TF_STATE_CONTAINER)'
                    backendAzureRmKey: 'prod.terraform.tfstate'

                - task: TerraformTaskV4@4
                  displayName: Terraform Apply
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/environments/prod'
                    environmentServiceNameAzureRM: 'azdev-service-connection'
                    commandOptions: 'tfplan'